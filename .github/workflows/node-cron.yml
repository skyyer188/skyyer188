name: Node Daily Cron Task

on:
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 = 北京时间10点
  workflow_dispatch:

jobs:
  run-node-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 删掉 cache: 'npm' 这一行！不再要求lock文件

      - name: Install dependencies
        run: npm install

      - name: Run node script
        run: node index.js
